name: FoodBridge CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  backend-lint-and-tests:
    name: Backend Lint & Pytest Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio flake8 httpx pydantic pydantic-settings
          pip install -e services/shared
          pip install -r services/listing-service/requirements.txt
          pip install -r services/matching-service/requirements.txt
          pip install -r services/notification-service/requirements.txt
          pip install -r services/logistics-service/requirements.txt
          pip install -r services/analytics-service/requirements.txt
          pip install -r services/expiry-job/requirements.txt

      - name: Python Syntax & Lint Check
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 services/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 services/ --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

      - name: Run Complete Test Suite
        env:
          USE_FIRESTORE_EMULATOR: "true"
          EVENT_BUS_TYPE: "in_memory"
        run: |
          python scripts/test_runner.py

  frontend-build:
    name: Frontend TypeScript & PWA Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: web/package.json

      - name: Install Web Dependencies
        working-directory: web
        run: npm ci

      - name: Build Web Application
        working-directory: web
        run: npm run build

  terraform-validate:
    name: Terraform Format & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform Init
        working-directory: infra/terraform
        run: terraform init -backend=false

      - name: Terraform Format Check
        working-directory: infra/terraform
        run: terraform fmt -check -diff

      - name: Terraform Validate
        working-directory: infra/terraform
        run: terraform validate
